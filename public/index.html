<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A coding agent that runs on your machine — reads files, writes code, runs commands, with your approval.">
<title>Local AI Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1017'/%3E%3Cpath d='M22 20l-10 12 10 12M42 20l10 12-10 12' fill='none' stroke='%2338bdf8' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">

  <div class="scrim" id="scrim" hidden></div>

  <aside class="sidebar" id="sidebar" aria-label="Workspace">
    <div class="brand">
      <div class="logo" aria-hidden="true">&lt;/&gt;</div>
      <div class="brand-text">
        <div class="brand-name">Local AI Studio</div>
        <div class="brand-sub">coding agent</div>
      </div>
      <button class="icon-btn only-mobile" id="sidebar-close" aria-label="Close workspace">✕</button>
    </div>

    <div class="root-line">
      <span class="root-label">workspace</span>
      <code id="root-path" title="workspace root">…</code>
    </div>

    <div class="side-actions">
      <button class="btn ghost small" id="new-chat">+ New chat</button>
      <button class="btn ghost small" id="tree-refresh" title="Refresh file tree">↻</button>
    </div>

    <div class="tree" id="tree" role="tree" aria-label="Files"></div>

    <div class="side-foot">
      <span id="conn-state" class="state idle">connecting…</span>
      <button class="link-btn" id="clear-chat">clear</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="sidebar-toggle" aria-label="Open workspace">☰</button>

      <select id="model-select" class="model-select" aria-label="Model"></select>

      <div class="top-actions">
        <label class="toggle" title="Run tools without asking (dangerous)">
          <input type="checkbox" id="auto-approve">
          <span>auto-approve</span>
        </label>
        <button class="icon-btn" id="stop" title="Stop" hidden>■</button>
      </div>
    </header>

    <div class="banner" id="banner" hidden></div>

    <section class="chat" id="chat" aria-live="polite"></section>

    <footer class="composer">
      <div class="composer-row">
        <textarea id="prompt" rows="1" placeholder="Ask for a change, or describe a task…" aria-label="Message"></textarea>
        <button class="btn primary" id="send">Send</button>
      </div>
      <div class="composer-hint">
        <span>Enter to send · Shift+Enter for a new line</span>
        <span id="hint" class="muted"></span>
      </div>
    </footer>
  </main>
</div>

<dialog class="preview" id="preview">
  <header>
    <span id="preview-path">file</span>
    <form method="dialog"><button class="icon-btn" aria-label="Close">✕</button></form>
  </header>
  <pre id="preview-body"></pre>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
